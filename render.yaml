services:
  - type: web
    name: syncbeat
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:client
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CLIENT_ORIGIN
        value: "*"
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
